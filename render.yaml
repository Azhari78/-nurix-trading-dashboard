services:
  - type: web
    name: stockbot-dashboard
    env: python
    buildCommand: pip install --upgrade pip && pip install -r requirements.txt
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT --workers 1
    healthCheckPath: /health
    autoDeploy: true
    # Persistent disk keeps dashboard runtime data across deploys/restarts.
    disk:
      name: stockbot-dashboard-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.3
      - key: WEB_CONCURRENCY
        value: "1"

      - key: MARKET_DATA_PROVIDER
        value: momostock
      - key: MOOMOO_OPEND_HOST
        value: 127.0.0.1
      - key: MOOMOO_OPEND_PORT
        value: "11111"
      - key: MOOMOO_MARKET_PREFIX
        value: US
      - key: MOOMOO_EXTENDED_TIME
        value: "false"
      - key: MOOMOO_FALLBACK_TO_YAHOO
        value: "true"
      - key: MOOMOO_LOG_HOME
        value: /var/data/moomoo
      - key: MOOMOO_HISTORY_DAYS_INTRADAY
        value: "30"
      - key: MOOMOO_HISTORY_DAYS_DAILY
        value: "730"
      - key: SYMBOLS
        value: AAPL,MSFT,NVDA,TSLA,AMZN,META,GOOGL,AMD,AVGO,NFLX,JPM,BAC,WMT,COST,KO,DIS,PYPL,PLTR,SOFI,RIVN,SPY,QQQ,IWM,DIA
      - key: DEFAULT_TIMEFRAME
        value: 5m
      - key: SIGNAL_TIMEFRAME
        value: 5m

      - key: STREAM_SSL_VERIFY
        value: "true"
      - key: STREAM_SSL_CA_BUNDLE
        value: ""

      # Safe defaults for first deploy. Stock order execution is paper-only until a broker adapter is added.
      - key: AUTO_TRADE_ENABLED
        value: "true"
      - key: PAPER_TRADING
        value: "true"
      - key: PAPER_WALLET_ENABLED
        value: "true"
      - key: PAPER_WALLET_START_USD
        value: "10000"
      - key: AUTO_TRADE_STATE_FILE
        value: "/var/data/auto_trade_state.json"
      - key: AUTO_TRADE_STATE_SAVE_INTERVAL_SECONDS
        value: "5"
      - key: AUTO_TRADE_SYMBOLS
        value: AAPL,MSFT,NVDA
      - key: AUTO_TRADE_STRATEGY_MODE
        value: long_only
      - key: AUTO_TRADE_ENABLE_SHORT
        value: "false"
      - key: AUTO_TRADE_MAX_OPEN_POSITIONS
        value: "1"
      - key: AUTO_TRADE_SYMBOL_VALIDATION_ENABLED
        value: "true"
      - key: TRADE_SIZE_USD
        value: "100"
      - key: TRADE_SIZE_USD_MIN
        value: "100"
      - key: TRADE_SIZE_USD_MAX
        value: "100"
      - key: TRADE_SIZE_PERCENT
        value: "0"
      - key: AUTO_TRADE_VOLATILITY_SIZING_ENABLED
        value: "true"
      - key: AUTO_TRADE_TARGET_ATR_PCT
        value: "0.9"
      - key: AUTO_TRADE_VOLATILITY_SIZE_MIN_MULT
        value: "0.55"
      - key: AUTO_TRADE_VOLATILITY_SIZE_MAX_MULT
        value: "1.65"
      - key: AUTO_TRADE_MIN_NOTIONAL_USD
        value: "3.5"
      - key: AUTO_TRADE_MIN_BUFFER_PCT
        value: "1.5"
      - key: AUTO_TRADE_ENTRY_CONFIRM_EMA_STACK
        value: "true"
      - key: AUTO_TRADE_ENTRY_CONFIRM_MACD
        value: "true"
      - key: AUTO_TRADE_ENTRY_REQUIRE_MACD_DATA
        value: "true"
      - key: AUTO_TRADE_PROFILE_WEAK_EMA_FAST
        value: "34"
      - key: AUTO_TRADE_PROFILE_WEAK_EMA_SLOW
        value: "89"
      - key: AUTO_TRADE_PROFILE_MIDDLE_EMA_FAST
        value: "20"
      - key: AUTO_TRADE_PROFILE_MIDDLE_EMA_SLOW
        value: "50"
      - key: AUTO_TRADE_PROFILE_STRONG_EMA_FAST
        value: "9"
      - key: AUTO_TRADE_PROFILE_STRONG_EMA_SLOW
        value: "21"
      - key: AUTO_TRADE_MIN_VOLUME_RATIO
        value: "1.2"
      - key: AUTO_TRADE_MIN_STRENGTH_CONFIDENCE
        value: "50"
      - key: AUTO_TRADE_SESSION_FILTER_ENABLED
        value: "false"
      - key: AUTO_TRADE_SESSION_UTC
        value: "0-23"
      - key: AUTO_TRADE_EXTREME_VOLATILITY_BLOCK_ENABLED
